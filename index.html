<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김아현 | 제품 마케터 포트폴리오</title>
<meta name="description" content="제품의 시작부터 성과까지, 함께 가는 마케터 김아현의 포트폴리오입니다.">
<meta property="og:title" content="김아현 | 제품 마케터 포트폴리오">
<meta property="og:description" content="제품의 시작부터 성과까지, 함께 가는 마케터 김아현입니다.">
<meta property="og:image" content="assets/46c79b4291.jpg">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F2EE}
html{scroll-behavior:smooth}
a{color:#121212;text-decoration:none}a:hover{color:#C2371F}
button{cursor:pointer;font-family:inherit}
.row-btn:hover{background:#F7F6F2}
.chip{transition:border-color .2s,transform .2s}.chip:hover{border-color:#121212;transform:translateY(-2px)}
.kw{animation:kwIn .5s ease both}
@keyframes kwIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.d1{transition-delay:.12s}.d2{transition-delay:.24s}.d3{transition-delay:.36s}.d4{transition-delay:.48s}.d5{transition-delay:.6s}.d6{transition-delay:.72s}
.grow{transition:width 1.4s cubic-bezier(.2,.7,.2,1) .2s}
.orbit{transition:transform 1.1s cubic-bezier(.4,.1,.2,1)}
.lift{transition:transform .3s ease,box-shadow .3s ease}
.lift:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(18,18,18,.10)}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.dw-chat{animation:dwChat 18s ease-in-out infinite}
.dw-chatimg{animation:dwChatImg 18s ease-in-out infinite}
.dw-cmp{animation:dwCmp 18s ease-in-out infinite}
.dw-reveal{animation:dwReveal 18s ease-in-out infinite}
.dw-scan{animation:dwScan 18s ease-in-out infinite}
.dw-l0{animation:dwL0 18s ease-in-out infinite}
.dw-l1{animation:dwL1 18s ease-in-out infinite}
.dw-l2{animation:dwL2 18s ease-in-out infinite}
@keyframes dwChat{0%,36%{opacity:1}42%,96%{opacity:0}100%{opacity:1}}
@keyframes dwChatImg{0%{transform:translateY(30%);opacity:0}8%{transform:translateY(0);opacity:1}14%{transform:translateY(0)}30%,100%{transform:translateY(-17.8%)}}
@keyframes dwCmp{0%,36%{opacity:0}42%,94%{opacity:1}100%{opacity:0}}
@keyframes dwReveal{0%,50%{clip-path:inset(0 100% 0 0)}74%,100%{clip-path:inset(0 0 0 0)}}
@keyframes dwScan{0%,50%{left:0;opacity:1}74%{left:100%;opacity:1}75%,100%{left:100%;opacity:0}}
@keyframes dwL0{0%,36%{opacity:1}40%,96%{opacity:0}100%{opacity:1}}
@keyframes dwL1{0%,38%{opacity:0}42%,72%{opacity:1}76%,100%{opacity:0}}
@keyframes dwL2{0%,72%{opacity:0}76%,94%{opacity:1}98%,100%{opacity:0}}
.cam-m{transform-origin:0 0;animation:camM 18s ease-in-out infinite}
@keyframes camM{0%,8%{transform:none}16%,26%{transform:translate(0,-31%) scale(1.5)}32%,42%{transform:translate(-50%,-31%) scale(1.5)}52%,70%{transform:translate(-62%,-59%) scale(1.8)}82%,100%{transform:none}}
.cam-v{transform-origin:0 0;animation:camV 18s ease-in-out infinite}
@keyframes camV{0%,8%{transform:none}16%,28%{transform:translate(0,-74%) scale(2.6)}36%,48%{transform:translate(0,-160%) scale(2.6)}58%,72%{transform:translate(-40%,-50%) scale(1.4)}82%,100%{transform:none}}
.cam-a{transform-origin:0 0;animation:camA 22s ease-in-out infinite}
.cam-b{transform-origin:0 0;animation:camB 22s ease-in-out infinite}
.fade-a{animation:fadeA 22s ease-in-out infinite}
.fade-b{animation:fadeB 22s ease-in-out infinite}
@keyframes camA{0%,4%{transform:none}12%,18%{transform:translate(-20%,-46%) scale(2.2)}28%,32%{transform:translate(-20%,-120%) scale(2.2)}40%,44%{transform:translate(-96%,-40%) scale(2)}50%,100%{transform:none}}
@keyframes camB{0%,52%{transform:none}60%,66%{transform:translate(-4.5%,-24%) scale(1.8)}80%,88%{transform:translate(-4.5%,-80%) scale(1.8)}96%,100%{transform:none}}
@keyframes fadeA{0%,46%{opacity:1}52%,94%{opacity:0}100%{opacity:1}}
@keyframes fadeB{0%,46%{opacity:0}52%,94%{opacity:1}100%{opacity:0}}
.store-scroll{animation:storeScroll 16s ease-in-out infinite}
.vprog{animation:vprog 9s linear infinite}
.tap{animation:tap .65s ease-out infinite}
@keyframes tap{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.3);opacity:0}}
.caret{animation:blink 1s steps(1) infinite}
@keyframes vprog{from{width:0}to{width:100%}}
.vpulse{animation:vpulse 1.8s ease-in-out infinite}
@keyframes vpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes storeScroll{0%,12%{transform:translateY(0)}62%,78%{transform:translateY(-619px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.kw,.blink,.store-scroll,.dw-chat,.dw-chatimg,.dw-cmp,.dw-reveal,.dw-scan,.dw-l0,.dw-l1,.dw-l2,.cam-m,.cam-v,.cam-a,.cam-b,.fade-a,.fade-b,.vprog,.vpulse{animation:none}.reveal{opacity:1;transform:none;transition:none}.grow,.orbit,.lift,.chip{transition:none}html{scroll-behavior:auto}}
</style>
<style>#app{min-height:100vh}body{word-break:keep-all;overflow-wrap:break-word}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div id="top" style="font-family: 'Inter Tight', 'Noto Sans KR', system-ui, sans-serif; color: #121212; background-color: #F3F2EE; background-image: linear-gradient(rgba(18,18,18,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(18,18,18,0.045) 1px, transparent 1px); background-size: 32px 32px; min-height: 100vh">

  <!-- NAV (sticky + progress) -->
  <header style="position: sticky; top: 0; z-index: 10; background: rgba(243,242,238,0.92); border-bottom: 1px solid #DEDCD5">
    <nav aria-label="주요 메뉴" style="max-width: 1200px; margin: 0 auto; padding: 16px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="#top" style="display: inline-flex; align-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; letter-spacing: 0.02em; color: #121212">
        <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: {{accent}}; display: inline-block"></span>
        KIM A HYUN _genos
      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 24px; font-size: 15px; font-weight: 500">
        <a href="#about">소개</a>
        <a href="#work">프로젝트</a>
        <a href="#ai">AI 자동화</a>
        <a href="#channels">운영 채널</a>
        <a href="#skills">툴</a>
        <a href="#career">경력</a>
        <a href="#contact" style="color: {{accent}}; font-weight: 700">연락하기</a>
      </div>
    </nav>
    <div aria-hidden="true" style="height: 3px">
      <div style="height: 3px; box-sizing: border-box; {{pageProgress}}"></div>
    </div>
  </header>

  <main>
  <!-- HERO -->
  <section aria-label="소개" style="max-width: 1160px; margin: 0 auto; padding: 96px 24px 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
    <div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 26px">
      <div data-rv="hero" class="reveal {{rv.hero}}" style="display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DEDCD5">
        <span class="blink" aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}}; display: inline-block"></span>
        PRODUCT MARKETING PM
      </div>
      <h1 class="reveal d1 {{rv.hero}}" style="margin: 0; font-size: clamp(38px, 5vw, 68px); line-height: 1.08; font-weight: 800; letter-spacing: -0.045em">제품의 시작 부터 성과까지,<br><span style="color: {{accent}}">함께 가는 마케터, 김아현입니다.</span></h1>
      
      <div class="reveal d3 {{rv.hero}}" style="display: flex; flex-wrap: wrap; gap: 10px">
        <a href="#work" aria-label="주요 프로젝트로 이동" style="display: inline-flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 24px; border-radius: 999px; background: #121212; color: #F3F2EE; font-weight: 600; font-size: 15px">프로젝트 보기
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"></path></svg>
        </a>
      </div>
    </div>

    <!-- LOOP DIAGRAM -->
    <div class="reveal d2 {{rv.hero}}" style="flex: 1 1 340px; display: flex; justify-content: center">
      <div style="position: relative; width: 340px; height: 340px; border-radius: 50%; background: #FFFFFF; border: 1px solid #DEDCD5; box-sizing: border-box">
        <svg role="img" aria-label="시도, 반응, 수정이 반복되는 실험 루프" width="340" height="340" viewBox="0 0 340 340" style="position: absolute; inset: 0">
          <circle cx="170" cy="170" r="118" fill="none" stroke="#CFCCC4" stroke-width="1.5" stroke-dasharray="4 7"></circle>
          <g class="orbit" style="transform-origin: 170px 170px; {{orbitStyle}}">
            <circle cx="170" cy="52" r="7" fill="{{accent}}"></circle>
          </g>
          <circle cx="{{n0.x}}" cy="{{n0.y}}" r="34" fill="{{n0.fill}}" stroke="#121212" stroke-width="1.5"></circle>
          <circle cx="{{n1.x}}" cy="{{n1.y}}" r="34" fill="{{n1.fill}}" stroke="#121212" stroke-width="1.5"></circle>
          <circle cx="{{n2.x}}" cy="{{n2.y}}" r="34" fill="{{n2.fill}}" stroke="#121212" stroke-width="1.5"></circle>
          <text x="170" y="178" text-anchor="middle" font-size="22" font-weight="700" fill="#121212" font-family="Inter Tight, sans-serif">{{iterLabel}}</text>
        </svg>
        <div aria-hidden="true" style="position: absolute; width: 68px; height: 68px; margin: -34px 0 0 -34px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; pointer-events: none; {{n0.boxStyle}}"><span style="display: block; font-size: 28px; line-height: 1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; transition: transform .35s; {{n0.emojiStyle}}">{{n0.emoji}}</span></div>
        <div aria-hidden="true" style="position: absolute; width: 68px; height: 68px; margin: -34px 0 0 -34px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; pointer-events: none; {{n1.boxStyle}}"><span style="display: block; font-size: 28px; line-height: 1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; transition: transform .35s; {{n1.emojiStyle}}">{{n1.emoji}}</span></div>
        <div aria-hidden="true" style="position: absolute; width: 68px; height: 68px; margin: -34px 0 0 -34px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; pointer-events: none; {{n2.boxStyle}}"><span style="display: block; font-size: 28px; line-height: 1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; transition: transform .35s; {{n2.emojiStyle}}">{{n2.emoji}}</span></div>
      </div>
    </div>
  </section>

  <!-- STATS -->
  <section id="about" aria-label="주요 수치" style="max-width: 1200px; margin: 0 auto; padding: 0 32px">
    <div data-rv="stats" style="border-radius: 24px; background: #121212; color: #F3F2EE; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div class="reveal {{s.cls}}" style="flex: 1 1 220px; border-radius: 18px; background: #1C1C1B; padding: 28px 24px; display: flex; flex-direction: column; gap: 10px">
          <div style="font-family: 'Inter Tight', 'Noto Sans KR', sans-serif; font-size: clamp(36px, 4vw, 52px); font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums">{{s.value}}</div>
          <div style="font-size: 15px; color: #C9C7C0">{{s.label}}</div>
          <div aria-hidden="true" style="height: 4px; border-radius: 4px; background: #2C2C2A; margin-top: 8px">
            <div class="grow" style="height: 4px; border-radius: 4px; box-sizing: border-box; {{s.barStyle}}"></div>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- ABOUT -->
  <section style="max-width: 1200px; margin: 0 auto; padding: 128px 32px 0; display: flex; flex-wrap: wrap; gap: 48px">
    <div data-rv="about" class="reveal {{rv.about}}" style="flex: 1 1 280px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.06em; color: {{accent}}">/ 01 — ABOUT ME</div>
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
      <p class="reveal d1 {{rv.about}}" style="margin: 0; font-size: clamp(26px, 2.8vw, 36px); line-height: 1.45; font-weight: 800; letter-spacing: -0.03em">고객의 반응에서 포인트를 짚고, 바로 다음 변화로 잇습니다.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 32px; padding-top: 8px">
        <div class="reveal d2 {{rv.about}}" style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 2px solid #121212">
          <div style="font-size: 14px; font-weight: 700; color: {{accent}}">01 · 이렇게 일합니다</div>
          <p style="margin: 0; font-size: 16px; line-height: 1.8; color: #3A3936">정답을 기다리기보다 먼저 시도하고, 고객의 반응으로 답을 찾는 편입니다. 답을 찾지 못하더라도, 그 시도는 다음 시도를 더 정확하게 만들어 줍니다. 그 과정 끝에 제품이 고객에게 닿는 순간, 가장 큰 재미를 느낍니다. 또, 손에 익은 반복 업무는 AI로 자동화해, 아낀 시간을 새로운 시도에 씁니다.</p>
        </div>
        <div class="reveal d3 {{rv.about}}" style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 2px solid #121212">
          <div style="font-size: 14px; font-weight: 700; color: {{accent}}">02 · 이렇게 증명했습니다</div>
          <p style="margin: 0; font-size: 16px; line-height: 1.8; color: #3A3936">1년 7개월 동안 8개 이커머스 채널을 운영하며 고객과 직접 소통하고 끊임없이 고쳐 나갔습니다. 그렇게 제품의 포인트를 짚는 감각을 얻었고, 콘텐츠 누적 도달 30만 회와 공동구매 매출 3,000만원을 만들었습니다.</p>
        </div>
        <div class="reveal d4 {{rv.about}}" style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 2px solid #121212">
          <div style="font-size: 14px; font-weight: 700; color: {{accent}}">03 · 이제 하고 싶은 일</div>
          <p style="margin: 0; font-size: 16px; line-height: 1.8; color: #3A3936">이제는 의료기기·코스메틱 제품 하나를 맡아, 기획부터 판매까지 끝까지 책임지고 싶습니다. 제노스의 좋은 제품이 더 많은 고객에게 쓰이도록, 지금까지 쌓은 채널과 마케팅 경험을 쓰겠습니다.</p>
        </div>
      </div>
      <div class="reveal d5 {{rv.about}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #6A6863; margin-right: 4px">주로 쓰는 툴</span>
        <sc-for list="{{tools}}" as="t" hint-placeholder-count="5">
          <span class="chip" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 18px; border: 1px solid #DEDCD5; border-radius: 999px; font-size: 14px; color: #121212; background: #FFFFFF">{{t}}</span>
        </sc-for>
        <a href="#skills" style="font-size: 13px; font-weight: 600; color: {{accent}}; margin-left: 4px">전체 툴 보기 →</a>
      </div>
    </div>
  </section>

  <!-- WORK -->
  <section id="work" style="max-width: 1200px; margin: 0 auto; padding: 128px 32px 0; display: flex; flex-direction: column; gap: 40px">
    <div data-rv="work" style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
      <div class="reveal {{rv.work}}" style="display: flex; flex-direction: column; gap: 16px">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.06em; color: {{accent}}">/ 02 — SELECTED WORK</div>
        <h2 style="margin: 0; font-size: clamp(32px, 4vw, 52px); font-weight: 800; letter-spacing: -0.04em">주요 프로젝트</h2>
      </div>
      <div class="reveal d1 {{rv.work}}" role="group" aria-label="프로젝트 분류 필터" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
          <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="box-sizing: border-box; {{f.style}}">{{f.label}} <span style="opacity: 0.6; margin-left: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{f.count}}</span></button>
        </sc-for>
      </div>
    </div>

    <div style="border-radius: 24px; background: #FFFFFF; border: 1px solid #DEDCD5; overflow: hidden">
      <sc-for list="{{projects}}" as="p" hint-placeholder-count="7">
        <div class="reveal {{p.cls}}" style="border-bottom: 1px solid #EDEBE5">
          <button type="button" class="row-btn" onClick="{{p.toggle}}" aria-expanded="{{p.expanded}}" style="width: 100%; background: transparent; border: 0; padding: 28px 28px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 32px; text-align: left; color: #121212; transition: background .2s">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 30px; color: #6A6863; width: 32px">{{p.num}}</span>
            <span style="flex: 999 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: clamp(20px, 2vw, 25px); line-height: 30px; font-weight: 700; letter-spacing: -0.02em">{{p.title}}</span>
              <span style="font-size: 15px; color: #5F5E59; {{p.sumStyle}}">{{p.summary}}</span>
              <span style="font-size: 13px; font-weight: 600; color: {{accent}}; {{p.jdStyle}}">{{p.jd}}</span>
            </span>
            <span style="flex: 0 0 164px; box-sizing: border-box; text-align: center; font-size: 12px; font-family: 'IBM Plex Mono', monospace; padding: 6px 12px; border-radius: 999px; background: #F3F2EE; color: #121212; white-space: nowrap; margin-top: 2px">{{p.catLabel}}</span>
            <span style="flex: 0 0 132px; text-align: left; white-space: nowrap; line-height: 30px; font-family: 'Inter Tight', 'Noto Sans KR', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: {{accent}}">{{p.metric}}</span>
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="box-sizing: border-box; margin-top: 4px; {{p.iconStyle}}"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
          <sc-if value="{{p.isOpen}}" hint-placeholder-val="{{false}}">
            <div class="kw" style="padding: 4px 28px 36px 92px; display: flex; flex-wrap: wrap; gap: 32px">
              <div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 10px">
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #6A6863">문제</div>
                <p style="margin: 0; font-size: 15px; line-height: 1.7">{{p.problem}}</p>
              </div>
              <div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 10px">
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #6A6863">실행</div>
